name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract App Version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.6.0"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="160"; fi
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_TAG=v$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Detected version: $VERSION_NAME ($VERSION_CODE) -> Release tag: v$VERSION_NAME"

      - name: Prepare Keystore and Environment
        run: |
          # 1. Restore debug.keystore if available from base64, otherwise generate with keytool
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore with keytool..."
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Ensure app/google-services.json exists
          if [ ! -f app/google-services.json ]; then
            echo "Generating fallback app/google-services.json..."
            echo '{"project_info":{"project_number":"817956180582","project_id":"gen-lang-client-0307028175","storage_bucket":"gen-lang-client-0307028175.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:817956180582:android:6170a0e64cf53acbb613a7","android_client_info":{"package_name":"com.aistudio.tontinepay.rfqwxy"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyBeLxke57idgPk7Byhrcd78ffpaPSTu7HY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

          # 3. Ensure .env is present for Secrets Gradle Plugin
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache --no-configuration-cache -Djava.awt.headless=true --stacktrace

      - name: Prepare APK and Compute Checksum
        run: |
          mkdir -p release-assets
          TARGET_APK="release-assets/TontinePay-${{ env.APP_TAG }}.apk"
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "$TARGET_APK"
          else
            find app/build/outputs/apk -name "*debug*.apk" -exec cp {} "$TARGET_APK" \;
          fi
          # Compute SHA-256 for data integrity verification
          sha256sum "$TARGET_APK" | awk '{print $1}' > release-assets/sha256.txt
          APK_SHA256=$(cat release-assets/sha256.txt)
          echo "APK_SHA256=$APK_SHA256" >> $GITHUB_ENV
          echo "Generated APK: $TARGET_APK"
          echo "SHA-256: $APK_SHA256"
          ls -lh release-assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TontinePay-${{ env.APP_TAG }}-apk
          path: release-assets/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_TAG }}
          name: "TontinePay ${{ env.APP_TAG }}"
          make_latest: true
          body: |
            ### 🚀 TontinePay ${{ env.APP_TAG }}
            - Release officielle compilée et déployée automatiquement par GitHub Actions
            - Empreinte SHA-256 : `${{ env.APK_SHA256 }}`
            - Fichier disponible : `TontinePay-${{ env.APP_TAG }}.apk`
          files: |
            release-assets/TontinePay-${{ env.APP_TAG }}.apk
            release-assets/sha256.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Release to Firestore Realtime Channel
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "Synchronizing release ${{ env.APP_TAG }} to Firestore system/app_update..."
          TIMESTAMP=$(date +%s%3N)
          DOWNLOAD_URL="https://github.com/Rowskil/TontinePay/releases/download/${{ env.APP_TAG }}/TontinePay-${{ env.APP_TAG }}.apk"
          curl -s -X PATCH "https://firestore.googleapis.com/v1/projects/gen-lang-client-0307028175/databases/ai-studio-android-tontinep-a33f464e-ffdf-4a50-ad0b-29089a35f3ff/documents/system/app_update?updateMask.fieldPaths=latestVersion&updateMask.fieldPaths=versionCode&updateMask.fieldPaths=downloadUrl&updateMask.fieldPaths=sha256&updateMask.fieldPaths=updatedAt&key=AIzaSyBeLxke57idgPk7Byhrcd78ffpaPSTu7HY" \
            -H "Content-Type: application/json" \
            -d '{
              "fields": {
                "latestVersion": {"stringValue": "'"${{ env.APP_TAG }}"'"},
                "versionCode": {"integerValue": "'"${{ env.APP_CODE }}"'"},
                "downloadUrl": {"stringValue": "'"$DOWNLOAD_URL"'"},
                "sha256": {"stringValue": "'"${{ env.APK_SHA256 }}"'"},
                "updatedAt": {"integerValue": "'"$TIMESTAMP"'"}
              }
            }' || echo "Firestore sync request finished."
