name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Keystore and Environment
        run: |
          # 1. Restore debug.keystore if available from base64, otherwise generate with keytool
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore with keytool..."
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Ensure app/google-services.json exists
          if [ ! -f app/google-services.json ]; then
            echo "Generating fallback app/google-services.json..."
            echo '{"project_info":{"project_number":"817956180582","project_id":"gen-lang-client-0307028175","storage_bucket":"gen-lang-client-0307028175.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:817956180582:android:6170a0e64cf53acbb613a7","android_client_info":{"package_name":"com.aistudio.tontinepay.rfqwxy"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyBeLxke57idgPk7Byhrcd78ffpaPSTu7HY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

          # 3. Ensure .env is present for Secrets Gradle Plugin
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache --no-configuration-cache -Djava.awt.headless=true --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-assets/TontinePay-v1.6.0.apk
          else
            find app/build/outputs/apk -name "*debug*.apk" -exec cp {} release-assets/TontinePay-v1.6.0.apk \;
          fi
          ls -lh release-assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TontinePay-v1.6.0-apk
          path: release-assets/TontinePay-v1.6.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release (v1.6.0)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: "TontinePay v1.6.0"
          make_latest: true
          body: |
            ### 🚀 TontinePay v1.6.0
            - Nouveau logo officiel transparent et épuré
            - Mode de tours automatiques configurables
            - Fréquence quotidienne
            - Calendrier de date planifiée intégré
            - Micro-animations tactiles fluides
            - Téléchargement direct de l'APK
          files: release-assets/TontinePay-v1.6.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
